[package]
name = "openstax.chemistry_equilibrium"
version = "0.1.0"
language = "0.2"
namespace = "urn:openstax:clir:chemistry-equilibrium"

# Каталожная метадата (DECISION-0051). НЕ семантика: в CLIR не понижается.
