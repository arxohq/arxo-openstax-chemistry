# Манифест §10 — маркер корня пакета (DECISION-0033). Заголовки §22 в самих
# `.law` обязаны совпадать с этим именем (LDC-E1109, lawc check).
#
# ВЫЧИСЛИТЕЛЬНЫЙ пакет (DECISION-0123): нормативного источника у него нет,
# юрисдикции нет, правового статуса нет. Каталожная секция `[metadata]`
# DECISION-0051 описывает АКТ и здесь намеренно отсутствует.
[package]
name = "calc.reaction_kinetics"
version = "0.1.0"
language = "0.2"
namespace = "urn:law:calc:reaction-kinetics"

# `law.cert/0.1` — сертифицированные границы §259.2: без флага exp/ln
# первого порядка и Аррениус вне v1-среза. Единицы — именами предикатов
# (приём `calc.first_order_dynamics`): вход в логарифм/экспоненту —
# безразмерное число, Quantity §259.1 туда не входит.
[features]
enabled = ["law.cert/0.1"]
semanticLayer = "L1"

# Секции `[[tests]]` здесь НЕТ, и это конвенция категории, а не пропуск
# (как у `calc.acid_base`): сценарии вычислителя исполняет
# `check_primitives.py`, глобая `tests/`, а общий раннер `.lawtest` ищет
# снимок пакета в `corpus/clir` — которого у вычислителя без корпусного
# потребителя нет по построению (LOWERED_ACTS).

[authoring]
local_imports = "explicit"
