<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="342" viewBox="0 0 1230 342" role="img"><title>Observation, definition and model are distinct; checker-pending is a diagnostic</title><rect width="1230" height="342" rx="20" fill="#f5f0e5"/><g font-family="Arial, Helvetica, sans-serif" fill="#15263d"><text x="34" y="45" font-size="17" fill="#246c65">WHAT KIND OF CLAIM IS BEING CHECKED?</text><rect x="34" y="82" width="360" height="145" rx="12" fill="white"/><text x="54" y="123" font-size="25" fill="#15263d">Observation</text><text x="54" y="163" font-size="16" fill="#15263d">An explicitly recorded statement</text><text x="54" y="194" font-size="16" fill="#15263d">No inference from an absent record</text><rect x="434" y="82" width="360" height="145" rx="12" fill="white"/><text x="454" y="123" font-size="25" fill="#15263d">Definition</text><text x="454" y="163" font-size="16" fill="#15263d">A named concept and its conditions</text><text x="454" y="194" font-size="16" fill="#15263d">No automatic laboratory validation</text><rect x="834" y="82" width="360" height="145" rx="12" fill="white"/><text x="854" y="123" font-size="25" fill="#15263d">Model</text><text x="854" y="163" font-size="16" fill="#15263d">A conclusion under supplied assumptions</text><text x="854" y="194" font-size="16" fill="#15263d">A named checker can remain pending</text><text x="34" y="270" font-size="18" fill="#b86135">Checked example: checker-pending is TRUE_ONLY / COMPUTED for the diagnostic predicate.</text><text x="34" y="303" font-size="16" fill="#15263d">That result identifies a missing external checker; it does not validate a coordination structure.</text></g></svg>
